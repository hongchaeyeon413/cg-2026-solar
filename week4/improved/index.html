<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>복합 연구시설 — 스마트 점검 & 미니맵 뷰어</title>
  <link rel="stylesheet" href="demo.css">
  <style>
    .wrap {
      grid-template-columns: minmax(0, 1fr) 18rem;
      height: 100vh;
      height: 100dvh;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--d-canvas, #0f172a);
    }
    #cv {
      width: 100%;
      height: 100%;
      display: block;
    }
    .minimap-card {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 230px;
      height: 190px;
      background: rgba(18, 28, 42, 0.88);
      border: 2px solid var(--d-accent, #1f6feb);
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      overflow: hidden;
      z-index: 10;
      backdrop-filter: blur(6px);
    }
    #minimap {
      width: 100%;
      height: 100%;
      display: block;
    }
    #tasks {
      padding: 0;
      margin: 8px 0;
      list-style: none;
    }
    #tasks li {
      padding: 8px 10px;
      margin-bottom: 6px;
      border: 1px solid var(--d-line, #30363d);
      border-radius: 6px;
      background: var(--d-bg, #161b22);
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 12px;
      line-height: 1.4;
    }
    #tasks li:hover {
      border-color: var(--d-accent, #1f6feb);
      transform: translateX(2px);
    }
    .hint-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 36, 0.82);
      color: #e2e8f0;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11.5px;
      pointer-events: none;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div id="readings" class="readout"></div>
    <div class="hint-banner">
      <span id="focus-status">💡 3D 부품 직접 클릭 또는 미니맵 클릭 시 관찰 시점으로 자동 이동합니다</span>
    </div>

    <div class="minimap-card">
      <canvas id="minimap" width="230" height="190"></canvas>
    </div>
  </div>

  <div class="panel">
    <h1>복합 연구시설 점검</h1>
    <p class="sub">스마트 클릭 & 미니맵 네비게이터</p>
    <button id="home" class="btn">기본 카메라 위치로 복귀</button>
    <button id="measure" class="btn">소요 시간 측정 시작</button>
    <div class="ctl">
      <label>점검 목록 (클릭 시 자동 접근)</label>
      <ul id="tasks"></ul>
    </div>
  </div>
</div>

<script src="demo.js"></script>
<script src="d04-inspection-model.js"></script>
<script src="d04-inspection-controls.js"></script>
<script src="d04-inspection-viewer.js"></script>
<script src="d04-inspection-student.js"></script>
</body>
</html>
